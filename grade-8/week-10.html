<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <meta name="description" content="Grade 8 English Week 10 touchscreen classroom activities for Lessons 1-5.">
  <title>Grade 8 English | Week 10 Touchscreen Challenge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071321;
      --panel: #10243c;
      --panel-2: #172e4b;
      --line: #2e4d72;
      --text: #f8fbff;
      --soft: #d8e3f1;
      --muted: #93a8c1;
      --cyan: #5de2ea;
      --yellow: #fff200;
      --pink: #ff8fa8;
      --mint: #71e6a2;
      --orange: #ffb65e;
      --red: #ff6f7f;
      --shadow: 0 24px 74px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% -4%, rgba(93, 226, 234, .14), transparent 28rem),
        radial-gradient(circle at 100% 12%, rgba(255, 143, 168, .1), transparent 30rem),
        var(--bg);
    }

    a, button { touch-action: manipulation; }
    button { font: inherit; }

    a:focus-visible,
    button:focus-visible {
      outline: 4px solid var(--yellow);
      outline-offset: 3px;
    }

    .shell {
      width: min(1660px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 18px clamp(18px, 3vw, 46px) 16px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 13px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .home-link {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--cyan);
      background: rgba(16, 36, 60, .9);
      text-decoration: none;
      font-size: 1.35rem;
      font-weight: 950;
    }

    .brand-kicker,
    .eyebrow {
      color: var(--cyan);
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .brand-kicker { font-size: clamp(.7rem, 1vw, .9rem); }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(1.45rem, 2.4vw, 2.45rem);
      line-height: 1;
    }

    .routine {
      min-width: 340px;
      min-height: 58px;
      padding: 8px 16px 8px 9px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(16, 36, 60, .9);
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--soft);
    }

    .routine-number {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: var(--bg);
      background: var(--yellow);
      font-size: 1.1rem;
      font-weight: 950;
    }

    .routine strong { color: var(--text); }

    .lesson-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .lesson-tab {
      min-height: 62px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(16, 36, 60, .82);
      color: var(--soft);
      text-align: left;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .lesson-tab span {
      display: block;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .lesson-tab strong {
      display: block;
      margin-top: 4px;
      font-size: clamp(.82rem, 1.05vw, 1rem);
    }

    .lesson-tab:hover,
    .lesson-tab:focus-visible {
      border-color: var(--cyan);
      outline: none;
      transform: translateY(-2px);
    }

    .lesson-tab.active {
      color: var(--bg);
      background: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 10px 28px rgba(93, 226, 234, .18);
    }

    .lesson-tab.active span { color: rgba(7, 19, 33, .72); }

    .activity-card {
      min-height: 0;
      padding: clamp(16px, 2vw, 28px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(16, 36, 60, .98), rgba(8, 24, 42, .99));
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto minmax(300px, 1fr) auto;
      gap: 14px;
      overflow: hidden;
    }

    .activity-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 29%);
      align-items: end;
      gap: 28px;
    }

    .eyebrow {
      margin: 0 0 7px;
      font-size: .78rem;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 3.55rem);
      line-height: .99;
    }

    .instruction {
      margin: 9px 0 0;
      color: var(--soft);
      font-size: clamp(.92rem, 1.3vw, 1.16rem);
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      color: var(--soft);
      font-size: .88rem;
      font-weight: 850;
    }

    .progress-track {
      height: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #08192b;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--mint));
      transition: width .3s ease;
    }

    .tier-track {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .tier-step {
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(7, 19, 33, .55);
      font-size: .72rem;
      font-weight: 950;
      letter-spacing: .08em;
      text-align: center;
    }

    .tier-step.active[data-tier="START"] { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
    .tier-step.active[data-tier="BUILD"] { color: var(--bg); background: var(--orange); border-color: var(--orange); }
    .tier-step.active[data-tier="EXTEND"] { color: var(--bg); background: var(--pink); border-color: var(--pink); }

    .stage {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(330px, .9fr) minmax(460px, 1.2fr);
      gap: 22px;
    }

    .prompt-card,
    .response-card,
    .finish-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-2);
    }

    .prompt-card {
      min-height: 0;
      padding: clamp(22px, 3vw, 42px);
      display: grid;
      align-content: center;
      gap: 14px;
    }

    .challenge-label {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--cyan);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .tier-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 15px rgba(93, 226, 234, .75);
    }

    .prompt-text {
      margin: 0;
      font-size: clamp(1.3rem, 2.25vw, 2.5rem);
      line-height: 1.18;
      font-weight: 850;
    }

    .source-line {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 750;
    }

    .response-card {
      min-height: 0;
      padding: clamp(18px, 2vw, 28px);
      display: grid;
      align-content: center;
      gap: 14px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice {
      position: relative;
      min-height: 82px;
      padding: 15px 16px 15px 50px;
      border: 2px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      background: var(--panel);
      font-size: clamp(.96rem, 1.35vw, 1.24rem);
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .key-hint {
      position: absolute;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      color: var(--bg);
      background: var(--muted);
      font-size: .78rem;
      font-weight: 950;
    }

    .choice:hover,
    .choice:focus-visible,
    .tool-button:hover,
    .tool-button:focus-visible {
      border-color: var(--cyan);
      outline: none;
      transform: translateY(-2px);
    }

    .choice.correct {
      color: var(--bg);
      background: var(--mint);
      border-color: var(--mint);
    }

    .choice.correct .key-hint { color: var(--mint); background: var(--bg); }

    .choice.wrong {
      background: rgba(255, 111, 127, .17);
      border-color: var(--red);
    }

    .choice:disabled { cursor: default; transform: none; }

    .oral-gate {
      padding: 15px 17px;
      border: 1px solid rgba(255, 242, 0, .58);
      border-radius: 15px;
      background: rgba(255, 242, 0, .06);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
    }

    .oral-gate strong { color: var(--yellow); }
    .oral-gate p { margin: 4px 0 0; color: var(--soft); }

    .feedback {
      min-height: 72px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      grid-template-columns: 46px 1fr;
      align-items: center;
      gap: 13px;
      background: rgba(7, 19, 33, .74);
    }

    .feedback-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--bg);
      background: var(--muted);
      font-size: 1.35rem;
      font-weight: 950;
    }

    .feedback strong { font-size: 1.04rem; }
    .feedback p { margin: 4px 0 0; color: var(--soft); }
    .feedback.success { border-color: rgba(113, 230, 162, .7); }
    .feedback.success .feedback-icon { background: var(--mint); }
    .feedback.error { border-color: rgba(255, 111, 127, .75); }
    .feedback.error .feedback-icon { color: white; background: var(--red); }
    .feedback.reveal { border-color: rgba(255, 242, 0, .7); }
    .feedback.reveal .feedback-icon { background: var(--yellow); }

    .teacher-toolbar {
      min-height: 56px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .teacher-tip {
      max-width: 390px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 750;
      text-align: right;
    }

    .tool-button {
      min-height: 50px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--soft);
      background: var(--panel);
      font-weight: 850;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, opacity .12s ease;
    }

    .tool-button.primary {
      color: var(--bg);
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .tool-button.confirm {
      color: var(--bg);
      background: var(--mint);
      border-color: var(--mint);
    }

    .tool-button:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .finish-card {
      grid-column: 1 / -1;
      min-height: 100%;
      padding: clamp(30px, 5vw, 70px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .finish-inner { width: min(850px, 100%); }

    .finish-mark {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      color: var(--bg);
      background: var(--mint);
      font-size: 2.45rem;
      font-weight: 950;
    }

    .finish-card h3 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 4rem);
    }

    .finish-card p {
      max-width: 680px;
      margin: 14px auto 0;
      color: var(--soft);
      font-size: clamp(1rem, 1.5vw, 1.22rem);
      line-height: 1.45;
    }

    .finish-model {
      margin-top: 20px;
      padding: 16px 18px;
      border-left: 7px solid var(--yellow);
      border-radius: 12px;
      color: var(--text);
      background: var(--bg);
      font-size: clamp(1rem, 1.45vw, 1.2rem);
      font-weight: 800;
      text-align: left;
    }

    @media (max-width: 1000px) {
      body { overflow: auto; }
      .shell { min-height: 100vh; }
      .lesson-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lesson-tab:last-child { grid-column: span 2; }
      .stage { grid-template-columns: 1fr; }
      .teacher-toolbar,
      .toolbar-left,
      .toolbar-right { flex-wrap: wrap; }
      .teacher-tip { max-width: none; flex: 1 1 100%; text-align: left; }
    }

    @media (max-width: 680px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .routine { min-width: 0; width: 100%; }
      .activity-heading { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
      .oral-gate { grid-template-columns: 1fr; }
      .activity-card { overflow: visible; }
      .teacher-toolbar { flex-direction: column; }
      .toolbar-left,
      .toolbar-right { width: 100%; }
      .tool-button { flex: 1 1 auto; }
    }

    @media (max-height: 850px) and (min-width: 1001px) {
      .shell { padding-top: 9px; padding-bottom: 9px; gap: 8px; }
      .topbar h1 { font-size: 1.7rem; }
      .routine { min-height: 46px; }
      .routine-number { width: 36px; height: 36px; }
      .lesson-tab { min-height: 48px; padding: 6px 10px; }
      .activity-card { padding: 13px 18px; gap: 9px; grid-template-rows: auto auto minmax(255px, 1fr) auto; }
      h2 { font-size: clamp(1.7rem, 2.5vw, 2.55rem); }
      .instruction { margin-top: 5px; }
      .prompt-card { padding: 20px 28px; }
      .prompt-text { font-size: clamp(1.2rem, 1.9vw, 1.95rem); }
      .choice { min-height: 62px; padding-top: 10px; padding-bottom: 10px; }
      .feedback { min-height: 58px; padding-top: 7px; padding-bottom: 7px; }
      .teacher-toolbar { min-height: 48px; }
      .tool-button { min-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-line">
        <a class="home-link" href="../index.html" aria-label="Return to lesson library">‹</a>
        <div>
          <div class="brand-kicker">MRISB | GRADE 8 ENGLISH</div>
          <h1>Week 10 Touchscreen Challenge</h1>
        </div>
      </div>
      <div class="routine" aria-label="Classroom routine">
        <span class="routine-number" id="turnNumber">01</span>
        <span><strong>Read fully.</strong> Choose carefully. Explain the link.</span>
      </div>
    </header>

    <nav class="lesson-tabs" aria-label="Select a lesson">
      <button class="lesson-tab active" data-lesson="1"><span>Lesson 1</span><strong>Risk Vocabulary + EQ</strong></button>
      <button class="lesson-tab" data-lesson="2"><span>Lesson 2</span><strong>Assess + Monitor Risk</strong></button>
      <button class="lesson-tab" data-lesson="3"><span>Lesson 3</span><strong>Article Evidence</strong></button>
      <button class="lesson-tab" data-lesson="4"><span>Lesson 4</span><strong>Modifiers + Reporting</strong></button>
      <button class="lesson-tab" data-lesson="5"><span>Lesson 5</span><strong>Argument + Debate</strong></button>
    </nav>

    <main class="activity-card">
      <section class="activity-heading">
        <div>
          <p class="eyebrow" id="activityEyebrow"></p>
          <h2 id="activityTitle"></h2>
          <p class="instruction" id="activityInstruction"></p>
        </div>
        <div>
          <div class="score-line"><span id="progressText"></span><span id="scoreText"></span></div>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </section>

      <section class="tier-track" aria-label="Challenge level">
        <div class="tier-step" data-tier="START">START | Recognise</div>
        <div class="tier-step" data-tier="BUILD">BUILD | Apply</div>
        <div class="tier-step" data-tier="EXTEND">EXTEND | Justify</div>
      </section>

      <section class="stage" id="activityStage" aria-live="polite"></section>

      <section class="feedback" id="feedbackPanel" aria-live="assertive">
        <div class="feedback-icon" id="feedbackIcon">?</div>
        <div><strong id="feedbackTitle">Read every option</strong><p id="feedbackText">The board player chooses only after the class has formed an answer.</p></div>
      </section>
    </main>

    <footer class="teacher-toolbar">
      <div class="toolbar-left">
        <button class="tool-button" id="resetButton">Reset lesson</button>
        <button class="tool-button" id="revealButton">Reveal answer</button>
        <button class="tool-button" id="soundButton" aria-pressed="true">Sound on</button>
      </div>
      <div class="toolbar-right">
        <span class="teacher-tip" id="teacherTip"></span>
        <button class="tool-button primary" id="nextButton" disabled>Next challenge</button>
        <button class="tool-button" id="fullscreenButton">Full screen</button>
      </div>
    </footer>
  </div>

  <script>
    const lessons = {
      1: {
        eyebrow: "LESSON 1 | SB 124 · LC 49A",
        title: "Risk vocabulary under pressure",
        instruction: "Use context, word relationships and precise sentences to decide how risk can affect a life.",
        tip: "After each correct choice, require a new example or a defence of the exact word—not only a definition.",
        finishTitle: "Risk words ready for accurate use",
        finishText: "Return to SB 124 and LC 49A. Complete or correct the vocabulary work before leaving the lesson.",
        finishModel: "High ceiling: explain how the same situation can create both a hazard and an opportunity to overcome a difficulty.",
        challenges: [
          { tier: "START", label: "CONTEXT | PRECISE NOUN", prompt: "Loose stones, a broken handrail and thick fog were the main ___ on the mountain route.", options: ["hazards", "remedies", "securities", "victories"], answer: "hazards", why: "Hazards are possible sources of harm or danger. Each listed condition could cause an accident.", gate: "Name a school or travel hazard and state the harm it could cause." },
          { tier: "START", label: "RELATIONSHIP | CLOSEST MEANING", prompt: "Which pair has the closest meaning in a risk discussion?", options: ["treacherous : dangerously unreliable", "security : uncertainty", "overcome : surrender to", "unpredictability : complete control"], answer: "treacherous : dangerously unreliable", why: "Treacherous describes conditions that are dangerous because they are unstable, deceptive or difficult to trust.", gate: "Use treacherous to describe a place or condition without using the word dangerous." },
          { tier: "START", label: "ANTONYM | ABSTRACT NOUN", prompt: "Which word is the strongest opposite of unpredictability?", options: ["certainty", "hazard", "effort", "courage"], answer: "certainty", why: "Unpredictability is the quality of not being known or expected. Certainty is the clearest opposite.", gate: "Explain why uncertainty is related but not identical to danger." },
          { tier: "BUILD", label: "CONTEXT | MEANING + GRAMMAR", prompt: "Which sentence uses security accurately?", options: ["Careful training gave the climbers greater security, but it did not remove every risk.", "The storm security across the coast before sunrise.", "They were security the broken rope by shouting.", "The path became a security because the rocks were loose."], answer: "Careful training gave the climbers greater security, but it did not remove every risk.", why: "Here security means safety or protection. The sentence also shows that greater safety is not the same as zero risk.", gate: "Give one action that increases security without guaranteeing success." },
          { tier: "BUILD", label: "WORD CHOICE | ACTION", prompt: "The team failed twice, changed its plan and finally solved the problem. Which verb best completes the idea?", options: ["overcame", "predicted", "abandoned", "endangered"], answer: "overcame", why: "To overcome is to succeed in dealing with an obstacle or difficulty. The changed plan and eventual success support it.", gate: "Use overcome in a full sentence about a habit, fear or academic difficulty." },
          { tier: "BUILD", label: "NUANCE | BEST FIT", prompt: "A shallow river looks calm, but hidden currents pull strongly beneath the surface. Which description is most precise?", options: ["treacherous because its danger is difficult to see", "secure because the surface is calm", "predictable because water always moves", "overcome because the river is shallow"], answer: "treacherous because its danger is difficult to see", why: "Treacherous often describes something that appears manageable but contains serious hidden danger.", gate: "Identify the clue that makes treacherous stronger than difficult." },
          { tier: "BUILD", label: "CAUSE + EFFECT | TWO-WORD LOGIC", prompt: "Which completion is most logical? ‘The route's ___ created several ___ that the guide had not planned for.’", options: ["unpredictability | hazards", "security | remedies", "hazards | securities", "victory | predictions"], answer: "unpredictability | hazards", why: "Unexpected changes can create sources of danger. The grammar and cause-and-effect relationship both fit.", gate: "Replace route with a different situation while keeping both words accurate." },
          { tier: "EXTEND", label: "ANALOGY | RELATIONSHIP", prompt: "Which analogy has the clearest relationship?", options: ["hazard : harm :: obstacle : delay", "security : danger :: success : effort", "overcome : surrender :: predict : know", "treacherous : safe :: certain : unknown"], answer: "hazard : harm :: obstacle : delay", why: "A hazard may lead to harm just as an obstacle may lead to delay. Both pairs show a possible cause and consequence.", gate: "Create a new analogy using unpredictability or overcome and explain the relationship." },
          { tier: "EXTEND", label: "ESSENTIAL QUESTION | BALANCED CLAIM", prompt: "Which claim best answers ‘How do the risks we take affect our lives?’", options: ["Risks can create growth or harm; their effects depend on purpose, preparation and consequences.", "Every risk improves a person's life if the person feels brave.", "All risks should be avoided because danger is always unacceptable.", "Risks affect only the person making the choice and nobody else."], answer: "Risks can create growth or harm; their effects depend on purpose, preparation and consequences.", why: "The claim is defensible and balanced. It recognises more than one outcome and names useful factors for judging a risk.", gate: "Give one example that supports the growth side and one that supports the harm side." },

      if (!soundOn) return;
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.045, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      } catch (error) {
        soundOn = false;
        dom.sound.textContent = 'Sound unavailable';
      }
    }

      const copy = [...items];

      dom.tip.textContent = lesson.tip;
      dom.progressText.textContent = `${itemNumber} of ${total}`;
      dom.scoreText.textContent = `${state.score} first-try correct`;
      dom.progressFill.style.width = `${state.finished ? 100 : (state.index / total) * 100}%`;
      dom.tiers.forEach(step => step.classList.toggle('active', !state.finished && step.dataset.tier === currentChallenge().tier));
      dom.next.disabled = !state.explanationConfirmed || state.finished;
      dom.reveal.disabled = state.finished;
      dom.turn.textContent = String(turnNumber).padStart(2, '0');
    }

    function render() {
      const lesson = lessons[currentLesson];
      const state = stateFor(currentLesson);
      updateHeader();

      if (state.finished) {
        dom.stage.innerHTML = `
          <article class="finish-card">
            <div class="finish-inner">
              <div class="finish-mark">✓</div>
              <h3>${lesson.finishTitle}</h3>
              <p>${lesson.finishText}</p>
              <div class="finish-model">${lesson.finishModel}</div>
            </div>
          </article>`;
        setFeedback('success', 'Lesson challenge complete', `${state.score} of ${lesson.challenges.length} were correct on the first attempt.`);
        dom.next.disabled = true;
        return;
      }

      const challenge = currentChallenge();
      dom.stage.innerHTML = `
        <article class="prompt-card">
          <div class="challenge-label"><span class="tier-dot"></span>${challenge.tier} | ${challenge.label}</div>
          <p class="prompt-text">${challenge.prompt}</p>
          <div class="source-line">Use your reasoning, copybook and the listed SB/LC pages.</div>
        </article>
        <article class="response-card" id="responseCard"></article>`;

      renderChoices(document.getElementById('responseCard'), challenge, state);
      if (!state.answered && !state.revealed) neutralFeedback();
    }

    function renderChoices(container, challenge, state) {
      const options = state.optionOrder || shuffle(challenge.options);
      state.optionOrder = options;
      container.innerHTML = `
        <div class="choice-grid">
          ${options.map((option, index) => `<button class="choice" data-option="${encodeURIComponent(option)}"><span class="key-hint">${index + 1}</span>${option}</button>`).join('')}
        </div>
        <div id="gateArea"></div>`;

      [...container.querySelectorAll('.choice')].forEach(button => {
        const option = decodeURIComponent(button.dataset.option);
        if (state.answered || state.revealed) {
          button.disabled = true;
          if (option === challenge.answer) button.classList.add('correct');
        }
        button.addEventListener('click', () => choose(option, button));
      });

      if (state.answered || state.revealed) renderGate(challenge, state);
    }

    function choose(option, button) {
      const state = stateFor(currentLesson);
      const challenge = currentChallenge();
      if (state.answered || state.revealed || button.disabled) return;
      state.attempts += 1;

      if (option === challenge.answer) {
        state.answered = true;
        if (state.attempts === 1) state.score += 1;
        tone(720, .18);
        [...document.querySelectorAll('.choice')].forEach(choice => {
          choice.disabled = true;
          if (decodeURIComponent(choice.dataset.option) === challenge.answer) choice.classList.add('correct');
        });
        setFeedback('success', 'Correct. Now prove it.', challenge.why);
        renderGate(challenge, state);
      } else {
        button.classList.add('wrong');
        button.disabled = true;
        tone(190, .16);
        setFeedback('error', 'Not precise enough', 'Re-read the prompt and every option. Check meaning, grammar and evidence before choosing again.');
      }
      updateHeader();
    }

    function renderGate(challenge, state) {
      const gateArea = document.getElementById('gateArea');
      if (!gateArea) return;
      gateArea.innerHTML = `
        <div class="oral-gate">
          <div><strong>Explanation gate</strong><p>${challenge.gate}</p></div>
          <button class="tool-button confirm" id="confirmExplanation">${state.explanationConfirmed ? 'Explanation confirmed' : 'Explanation heard'}</button>
        </div>`;
      const confirm = document.getElementById('confirmExplanation');
      confirm.disabled = state.explanationConfirmed;
      confirm.addEventListener('click', () => {
        state.explanationConfirmed = true;
        confirm.disabled = true;
        confirm.textContent = 'Explanation confirmed';
        setFeedback('success', 'Reason accepted', challenge.why);
        dom.next.disabled = false;
        tone(880, .12);
      });
    }

    function revealAnswer() {
      const state = stateFor(currentLesson);
      if (state.finished) return;
      const challenge = currentChallenge();
      state.revealed = true;
      state.answered = true;
      render();
      setFeedback('reveal', `Answer: ${challenge.answer}`, challenge.why);
      renderGate(challenge, state);
    }

    function nextChallenge() {
      const lesson = lessons[currentLesson];
      const state = stateFor(currentLesson);
      if (!state.explanationConfirmed) return;

      if (state.index >= lesson.challenges.length - 1) {
        state.finished = true;
      } else {
        state.index += 1;
        state.attempts = 0;
        state.answered = false;
        state.explanationConfirmed = false;
        state.revealed = false;
        state.optionOrder = null;
        turnNumber = turnNumber >= 99 ? 1 : turnNumber + 1;
      }
      render();
    }

    function switchLesson(lessonNumber) {
      currentLesson = lessonNumber;
      dom.tabs.forEach(tab => tab.classList.toggle('active', Number(tab.dataset.lesson) === lessonNumber));
      window.location.hash = `l${lessonNumber}`;
      render();
    }

    function clickChoiceByNumber(number) {
      const buttons = [...document.querySelectorAll('.choice')];
      const button = buttons[number - 1];
      if (button && !button.disabled) button.click();
    }

    dom.tabs.forEach(tab => tab.addEventListener('click', () => switchLesson(Number(tab.dataset.lesson))));
    dom.reset.addEventListener('click', () => {
      states[currentLesson] = newState();
      render();
    });
    dom.reveal.addEventListener('click', revealAnswer);
    dom.next.addEventListener('click', nextChallenge);
    dom.sound.addEventListener('click', () => {
      soundOn = !soundOn;
      dom.sound.textContent = soundOn ? 'Sound on' : 'Sound off';
      dom.sound.setAttribute('aria-pressed', String(soundOn));
      if (soundOn) tone(620, .1);
    });
    dom.fullscreen.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (error) {
        setFeedback('error', 'Full screen unavailable', 'Use the browser menu or presentation mode instead.');
      }
    });
    document.addEventListener('fullscreenchange', () => {
      dom.fullscreen.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    });
    document.addEventListener('keydown', event => {
      if (event.altKey && event.key === 'ArrowRight') {
        event.preventDefault();
        switchLesson(currentLesson === 5 ? 1 : currentLesson + 1);
        return;
      }
      if (event.altKey && event.key === 'ArrowLeft') {
        event.preventDefault();
        switchLesson(currentLesson === 1 ? 5 : currentLesson - 1);
        return;
      }
      if (['1', '2', '3', '4'].includes(event.key)) clickChoiceByNumber(Number(event.key));
      if (event.key.toLowerCase() === 'e') document.getElementById('confirmExplanation')?.click();
      if (event.key.toLowerCase() === 'n' && !dom.next.disabled) nextChallenge();
      if (event.key.toLowerCase() === 'r' && !dom.reveal.disabled) revealAnswer();
    });

    const hashLesson = Number(window.location.hash.replace('#l', ''));
    switchLesson(hashLesson >= 1 && hashLesson <= 5 ? hashLesson : 1);
  </script>
</body>
</html>
